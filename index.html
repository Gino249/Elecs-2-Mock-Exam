<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Elecs 2 Mock Exam Test</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--fg:#1c2230;--mu:#667085;--ac:#2563eb;--ok:#15803d;--bad:#b91c1c;--bd:#d9dde6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--fg:#e8ebf3;--mu:#9aa3b5;--ac:#6b9bff;--ok:#4ade80;--bad:#f87171;--bd:#2d3448}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--fg:#e8ebf3;--mu:#9aa3b5;--ac:#6b9bff;--ok:#4ade80;--bad:#f87171;--bd:#2d3448}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:1.6rem;margin:.2em 0}.c{text-align:center}.mu{color:var(--mu)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:var(--ac);color:#fff}button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.big{display:block;width:100%;margin:10px 0;padding:16px;font-size:1.05rem}
input[type=range]{width:100%}.n{font-size:2.4rem;font-weight:700;color:var(--ac)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 12px;font-size:.9rem}
.bar b{font-size:1rem}.bar button{padding:6px 14px}
.opt{display:block;padding:8px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:9px;cursor:pointer}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.fb{margin-top:8px;font-size:.93rem}.good{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
svg{max-width:340px;width:100%;color:var(--fg);stroke:currentColor;fill:none;stroke-width:2;font:12px sans-serif;display:block;margin:8px auto}canvas{width:100%;max-width:520px;border:1px solid var(--bd);border-radius:10px;display:block}
.pt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.pt input{width:80px;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
#bot{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:12px}
#bot>div{background:var(--card);border-radius:14px;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:14px;border:1px solid var(--bd)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.g2{grid-template-columns:1fr}}

.st{border-left:3px solid var(--ac);padding:2px 10px;margin:10px 0}.st span{font-size:.75rem;color:var(--mu);text-transform:uppercase}.st p{margin:2px 0;font-weight:600;word-break:break-word}
</style></head><body><div class="w" id="app"></div>
<div id="bot"><div><div style="display:flex;justify-content:space-between;align-items:center"><b>🤖 Elecs Bot</b><button class="g" onclick="closeBot()">Close</button></div><div class="g2"><div id="chat"></div><div id="sol" class="card"></div></div></div></div>
<script>
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=(x,d=2)=>(+(+x).toFixed(d)).toString();
// ---- PART 1 QUESTION BANK: [question, [4 options], index of correct, explanation]. Add your own from the PDF here.
const B=[
["About how much forward voltage does a conducting silicon diode drop?",["0.3 V","0.7 V","1.2 V","0.1 V"],1,"Silicon starts conducting near 0.7 V. Germanium is about 0.3 V."],
["When a diode is forward biased, the depletion region:",["Widens","Narrows","Stays the same","Disappears completely at 0.1 V"],1,"Forward bias pushes carriers toward the junction, so the depletion region gets thinner."],
["The reverse saturation current of a diode is mainly caused by:",["Majority carriers","Minority carriers","Free electrons from the battery","Avalanche breakdown"],1,"Minority carriers are swept across the reverse-biased junction, giving a small leakage current."],
["If temperature rises, the forward voltage of a silicon diode at a fixed current:",["Increases by about 2 mV/°C","Decreases by about 2 mV/°C","Stays constant","Doubles"],1,"The forward drop falls roughly 2 mV for every °C rise."],
["A Zener diode is normally operated in:",["Forward region","Reverse breakdown region","Cutoff only","Saturation"],1,"Zener regulators rely on the nearly constant voltage in reverse breakdown."],
["Which impurity makes an n-type semiconductor?",["Trivalent (e.g. boron)","Pentavalent (e.g. phosphorus)","Tetravalent","Noble gas"],1,"Pentavalent donors add extra free electrons, so the material is n-type."],
["The majority carriers in p-type material are:",["Electrons","Holes","Ions","Neutrons"],1,"Trivalent acceptors create holes, which are the majority carriers in p-type."],
["An ideal diode in forward bias behaves like:",["An open switch","A closed switch (short circuit)","A capacitor","A 0.7 V battery"],1,"An ideal diode conducts with zero drop when forward biased."],
["The intersection of the load line and the diode characteristic curve gives the:",["Breakdown voltage","Q-point (operating point)","Cutoff point","Peak inverse voltage"],1,"That point satisfies both the circuit equation and the diode's own curve."],
["For a series diode circuit with source E and resistor R, the load line intercepts are:",["VD = E and ID = E/R","VD = 0 and ID = E","VD = E/R and ID = E","VD = 0.7 and ID = R"],0,"From E = VD + ID·R: when ID = 0, VD = E. When VD = 0, ID = E/R."],
["The PIV of a diode in a half-wave rectifier with peak input Vm is about:",["Vm","2Vm","Vm/2","0.7 V"],0,"When the diode is off, the full peak of the source appears across it."],
["The PIV of each diode in a center-tapped full-wave rectifier (secondary peak Vm per half) is about:",["Vm","2Vm","Vm/2","4Vm"],1,"The off diode sees the conducting half's voltage plus its own half, so about 2Vm."],
["In a bridge rectifier, how many diodes conduct during each half cycle?",["1","2","3","4"],1,"Two opposite diodes conduct in each half cycle."],
["Ripple in a filtered rectifier is reduced by:",["A smaller capacitor","A larger filter capacitor","Removing the load","Lower supply frequency"],1,"A bigger capacitor discharges less between peaks."],
["For a BJT in the active region:",["Both junctions forward biased","BE forward, BC reverse","BE reverse, BC forward","Both junctions reverse biased"],1,"Amplification happens with the base-emitter forward and base-collector reverse biased."],
["Which is correct for a BJT?",["IE = IC + IB","IC = IE + IB","IB = IC + IE","IE = IC − IB"],0,"The emitter current is the sum of collector and base currents."],
["Common-base current gain α is defined as:",["IC/IB","IC/IE","IE/IB","IB/IC"],1,"α = IC/IE, always slightly less than 1."],
["Common-emitter current gain β is defined as:",["IC/IB","IC/IE","IE/IC","IB/IC"],0,"β = IC/IB, usually 50 to 300."],
["A BJT is in saturation when:",["Both junctions are forward biased","Both junctions are reverse biased","Only BE is reverse biased","IC is nearly zero"],0,"In saturation, both the BE and BC junctions are forward biased and VCE is small."],
["In cutoff, a BJT has approximately:",["IC ≈ 0 and VCE ≈ VCC","IC maximum and VCE ≈ 0","IB maximum","VBE = 5 V"],0,"With no base current, the transistor is an open switch, so VCE ≈ VCC."],
["Why is the fixed-bias circuit considered unstable?",["It uses too many resistors","Its Q-point depends strongly on β","It has no collector resistor","It needs two supplies"],1,"IC = β·IB, so any change in β moves the Q-point directly."],
["What does adding RE (emitter stabilized bias) do?",["Increases the effect of β on IC","Provides negative feedback that improves stability","Removes the need for RB","Makes VCE zero"],1,"If IC rises, VE rises, which lowers IB and pushes IC back down."],
["Which bias circuit gives the most stable Q-point?",["Fixed bias","Voltage-divider bias","Collector-to-base only with no RE","Base bias without RC"],1,"With a stiff divider, IC depends mainly on VB and RE, almost independent of β."],
["To get maximum undistorted output swing, the Q-point is placed:",["Near cutoff","Near saturation","Near the middle of the load line","At VCE = 0"],2,"Centering it leaves equal room to swing toward cutoff and saturation."],
["Thermal runaway in a BJT happens because a rise in temperature:",["Lowers ICBO","Raises leakage and collector current, which raises the temperature further","Lowers β","Turns the transistor off"],1,"It is a positive feedback loop between heat and collector current."],
["The thermal voltage VT at room temperature (about 25 °C) is close to:",["26 mV","0.7 V","2.6 V","260 mV"],0,"VT = kT/q ≈ 26 mV, used in the diode equation."]
];
// ---- PART 2 GENERATORS (random values every time)
const ID=v=>1.13e-5*Math.exp(v/.05);
function mc(q,c,ds,u,steps){const seen=new Set([f(c)]),v=[c];for(const d of ds)if(d>0&&!seen.has(f(d))){seen.add(f(d));v.push(d)}let k=1.3;while(v.length<4){const d=c*k;k+=.35;if(!seen.has(f(d))){seen.add(f(d));v.push(d)}}const o=sh(v.slice(0,4)),a=o.indexOf(c);return{t:'mc',img:sch(...cur),q,o:o.map(x=>f(x)+" "+u),a,steps,ans:"abcd"[a]+". "+f(c)+" "+u}}
const g1=()=>{const E=pick([5,6,9,10,12]),Rr=pick([1,1.5,2,2.2,3.3,4.7]),I=(E-.7)/Rr;
cur=['dio',{E,R:Rr}];return mc(`A silicon diode (0.7 V when conducting) is forward biased in series with a ${Rr} kΩ resistor and a ${E} V source. What is the diode current?`,I,[E/Rr,(E+.7)/Rr,I/2,I*10],"mA",[["The diode is on, so it drops 0.7 V. The resistor gets the voltage that is left over.",`VR = E − VD = ${E} − 0.7 = ${f(E-.7)} V`],["Now apply Ohm's law to the resistor. Volts divided by kilo-ohms gives milliamps.",`I = VR / R = ${f(E-.7)} / ${Rr} = ${f(I)} mA`]])};
const g2=()=>{let VCC,RB,RC,b,IB,IC,VCE;do{VCC=pick([9,10,12,15,18]);RB=pick([240,330,470,560]);RC=pick([1,1.5,2,2.2]);b=pick([50,80,100,120,150]);IB=(VCC-.7)/RB;IC=b*IB;VCE=VCC-IC*RC}while(VCE<1);
cur=['fix',{VCC,RB,RC,b}];const base=`Fixed-bias BJT circuit: VCC = ${VCC} V, RB = ${RB} kΩ, RC = ${RC} kΩ, β = ${b}, VBE = 0.7 V. `;
const st=[["Write KVL around the base loop. The supply drops 0.7 V across the base-emitter junction and the rest across RB.",`IB = (VCC − VBE) / RB = (${VCC} − 0.7) / ${RB}k = ${f(IB*1000)} µA`],["The collector current is β times the base current.",`IC = β × IB = ${b} × ${f(IB*1000)} µA = ${f(IC)} mA`]];
if(R(0,1))return mc(base+"Find IC.",IC,[IB*(b+1),VCC/RC,IC*2,IB*1000],"mA",st);
st.push(["Finally write KVL around the collector loop.",`VCE = VCC − IC × RC = ${VCC} − ${f(IC)} × ${RC} = ${f(VCE)} V`]);
return mc(base+"Find VCE.",VCE,[VCC-IB*RC,VCC-.7,VCC-IC*RC*1.5,VCC-IC],"V",st)};
const g3=()=>{let VCC,RB,RC,RE,b,IB,IC,IE,VCE;do{VCC=pick([12,15,18,20]);RB=pick([330,430,470]);RC=pick([1.5,2,2.2,3]);RE=pick([.5,.68,1,1.2]);b=pick([60,80,100,120]);IB=(VCC-.7)/(RB+(b+1)*RE);IC=b*IB;IE=(b+1)*IB;VCE=VCC-IC*RC-IE*RE}while(VCE<1);
cur=['emi',{VCC,RB,RC,RE,b}];const base=`Emitter-stabilized BJT: VCC = ${VCC} V, RB = ${RB} kΩ, RC = ${RC} kΩ, RE = ${RE} kΩ, β = ${b}, VBE = 0.7 V. `;
const st=[["Write KVL on the base-emitter loop. The emitter current IE = (β+1)·IB flows through RE, so RE looks (β+1) times bigger from the base.",`IB = (VCC − VBE) / (RB + (β+1)RE) = (${VCC} − 0.7) / (${RB}k + ${b+1} × ${RE}k) = ${f(IB*1000)} µA`],["Collector current is β times IB.",`IC = ${b} × ${f(IB*1000)} µA = ${f(IC)} mA`]];
if(R(0,1))return mc(base+"Find IC.",IC,[(VCC-.7)/RB*b,IE,IB*1000,IC*1.5],"mA",st);
st.push(["Now the collector-emitter loop. IE is only slightly bigger than IC.",`IE = (β+1) × IB = ${f(IE)} mA`],["Subtract the drops across RC and RE from the supply.",`VCE = VCC − IC×RC − IE×RE = ${VCC} − ${f(IC*RC)} − ${f(IE*RE)} = ${f(VCE)} V`]);
return mc(base+"Find VCE.",VCE,[VCC-IC*RC,VCC-.7,VCC-IB*RC,VCC-IC*(RC+RE)*1.4],"V",st)};
const g4=()=>{let VCC,R1,R2,RC,RE,VB,VE,IC,VCE;do{VCC=pick([12,15,18,20]);R1=pick([39,47,56,68]);R2=pick([6.8,8.2,10,12]);RC=pick([2.2,3,3.3,4.7]);RE=pick([.68,1,1.2,1.5]);VB=VCC*R2/(R1+R2);VE=VB-.7;IC=VE/RE;VCE=VCC-IC*(RC+RE)}while(VE<.6||VCE<1);
cur=['div',{VCC,R1,R2,RC,RE}];const base=`Voltage-divider bias: VCC = ${VCC} V, R1 = ${R1} kΩ, R2 = ${R2} kΩ, RC = ${RC} kΩ, RE = ${RE} kΩ, VBE = 0.7 V. Assume β is large so base loading is ignored and IC ≈ IE. `;
const st=[["Because the base current is tiny, R1 and R2 act as a plain voltage divider.",`VB = VCC × R2 / (R1 + R2) = ${VCC} × ${R2} / (${R1} + ${R2}) = ${f(VB)} V`],["The emitter sits one junction drop below the base.",`VE = VB − 0.7 = ${f(VE)} V`],["Ohm's law across RE gives the emitter current, which is about equal to IC.",`IC ≈ IE = VE / RE = ${f(VE)} / ${RE} = ${f(IC)} mA`]];
if(R(0,1))return mc(base+"Find IC.",IC,[VB/RE,VCC/(RC+RE),IC*2,VE/RC],"mA",st);
st.push(["Now KVL around the collector loop.",`VCE = VCC − IC × (RC + RE) = ${VCC} − ${f(IC)} × ${f(RC+RE)} = ${f(VCE)} V`]);
return mc(base+"Find VCE.",VCE,[VCC-IC*RC,VCC-VE,VCC-IC*(RC+RE)*1.5,VCC/2],"V",st)};
const g5=()=>{const E=pick([5,6,8,10,12]),Rr=pick([.5,.6,.8,1,1.2,1.5,2]),Im=E/Rr;let lo=0,hi=E;for(let k=0;k<60;k++){const v=(lo+hi)/2;ID(v)-(E-v)/Rr<0?lo=v:hi=v}const VQ=(lo+hi)/2,IQ=(E-VQ)/Rr;
return{t:'load',img:sch('dio',{E,R:Rr}),E,R:Rr,Im,ym:Im*1.15,VQ,IQ,q:`Load line analysis: a diode is in series with R = ${Rr} kΩ and a source E = ${E} V. The diode's I-V curve is on the graph. Enter any two points of the load line as (VD in volts, ID in mA). They will be plotted and joined by a line.`,
steps:[["The load line comes from KVL: E = VD + ID × R. First set ID = 0 to find where the line meets the voltage axis.",`VD = E = ${E} V  →  point (${E} V, 0 mA)`],["Now set VD = 0 to find where it meets the current axis.",`ID = E / R = ${E} / ${Rr} = ${f(Im)} mA  →  point (0 V, ${f(Im)} mA)`],["Draw a straight line through those two points. Where it crosses the diode curve is the Q-point.",`Q ≈ (${f(VQ)} V, ${f(IQ)} mA)`]],
ans:`Any two points on the line, e.g. (0 V, ${f(Im)} mA) and (${E} V, 0 mA). Q ≈ (${f(VQ)} V, ${f(IQ)} mA)`}};
let cur;
function sch(k,v){let s='';const L=(a,b,c,d)=>{s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`},
T=(x,y,t,a)=>{s+=`<text x="${x}" y="${y}" text-anchor="${a||'start'}" stroke="none" fill="currentColor">${t}</text>`},
Z=(x,y,l,r,t,tx,ty,a)=>{let p=`0,0 0,${l*.14}`;for(let i=0;i<6;i++)p+=` ${i%2?-6:6},${l*(.14+.72*(i+.5)/6)}`;p+=` 0,${l*.86} 0,${l}`;s+=`<polyline points="${p}" transform="translate(${x} ${y}) rotate(${r})"/>`;T(tx,ty,t,a)},
G=(x,y)=>{L(x-7,y,x+7,y);L(x-4,y+3,x+4,y+3);L(x-1,y+6,x+1,y+6)},
D=(x,y)=>{s+=`<circle cx="${x}" cy="${y}" r="2.5" fill="currentColor" stroke="none"/>`},K=x=>f(x)+" kΩ";
if(k=='dio'){L(60,40,100,40);Z(100,40,60,-90,"R = "+K(v.R),130,28,'middle');L(160,40,240,40);L(240,40,240,80);s+=`<polygon points="230,80 250,80 240,98" fill="currentColor"/>`;L(230,98,250,98);L(240,98,240,140);L(240,140,60,140);L(60,40,60,80);L(50,80,70,80);L(55,88,65,88);L(60,88,60,140);T(75,90,"E = "+v.E+" V");T(255,92,"Si diode");return `<svg viewBox="0 0 320 170">${s}</svg>`}
const y=140;L(190,y-15,190,y+15);L(190,y-6,230,y-28);L(190,y+6,230,y+28);
s+=`<polygon points="230,168 217.6,165.7 221.4,158.7" fill="currentColor"/><circle cx="210" cy="140" r="34" stroke-opacity=".35"/>`;
T(236,10,"VCC = "+v.VCC+" V");Z(230,14,58,0,"RC = "+K(v.RC),240,46);L(230,72,230,112);if(v.b)T(240,142,"β = "+v.b);
if(v.RE){L(230,168,230,178);Z(230,178,50,0,"RE = "+K(v.RE),240,206);L(230,228,230,232);G(230,232)}else{L(230,168,230,215);G(230,215)}
if(k=='fix'||k=='emi'){L(230,12,110,12);Z(110,20,60,0,"RB = "+K(v.RB),100,55,'end');L(110,80,110,140);L(110,140,190,140)}
if(k=='div'){L(230,12,110,12);Z(110,20,55,0,"R1 = "+K(v.R1),100,50,'end');L(110,75,110,140);D(110,140);L(110,140,190,140);L(110,140,110,160);Z(110,160,50,0,"R2 = "+K(v.R2),100,190,'end');L(110,210,110,215);G(110,215)}
if(k=='fb'){L(230,95,220,95);D(230,95);Z(220,95,60,90,"R2 = "+K(v.R2),190,84,'middle');L(160,95,155,95);D(155,95);Z(155,95,60,90,"R1 = "+K(v.R1),125,84,'middle');L(95,95,80,95);L(80,95,80,140);L(80,140,190,140);L(155,95,155,110);L(147,110,163,110);L(147,116,163,116);L(155,116,155,126);G(155,126)}
return `<svg viewBox="0 0 320 250">${s}</svg>`}
const g6=()=>{let VCC,R1,R2,RC,RE,b,RB,IB,IC,VC,VE,VB;do{VCC=pick([12,15,18,20]);R1=pick([68,82,91]);R2=pick([100,110,120]);RC=pick([2.7,3.3,3.9]);RE=pick([.39,.47,.51,.62]);b=pick([50,75,100]);RB=R1+R2;IB=(VCC-.7)/(RB+b*(RC+RE));IC=b*IB;VC=VCC-IC*RC;VE=IC*RE;VB=VE+.7}while(VC-VE<1);
cur=['fb',{VCC,R1,R2,RC,RE,b}];const base=`Voltage-feedback bias circuit shown: VCC = ${VCC} V, R1 = ${R1} kΩ, R2 = ${R2} kΩ, RC = ${RC} kΩ, RE = ${RE} kΩ, β = ${b}, VBE = 0.7 V. Take the collector-node current as approximately IC. `;
const st=[["R1 and R2 are in series between the collector and the base, so they act as one base resistor. The capacitor only matters for AC.",`RB = R1 + R2 = ${R1} + ${R2} = ${RB} kΩ`],["Write KVL from VCC through RC, RB, the base-emitter junction and RE. The feedback current through RC is about β times IB.",`IB = (VCC − VBE) / (RB + β(RC + RE)) = (${VCC} − 0.7) / (${RB}k + ${b} × ${f(RC+RE)}k) = ${f(IB*1000)} µA`],["Collector current is β times IB.",`IC = ${b} × ${f(IB*1000)} µA = ${f(IC)} mA`],["The collector voltage is the supply minus the drop across RC.",`VC = VCC − IC × RC = ${VCC} − ${f(IC)} × ${RC} = ${f(VC)} V`],["The emitter voltage is IE × RE, with IE about equal to IC. The base sits one junction drop above the emitter.",`VE = ${f(IC)} × ${RE} = ${f(VE)} V,  VB = VE + 0.7 = ${f(VB)} V`]];
const [n,c,u,ds]=pick([["IC",IC,"mA",[IB*1000,IC*1.5,(VCC-.7)/RB*b,IC/2]],["VC",VC,"V",[VCC-IC*(RC+RE),VCC-IB*RC,VCC-.7,VE]],["VB",VB,"V",[VE,VC,.7,VB*1.5]],["VE",VE,"V",[VB,IC*RC,VE*2,.7]]]);return mc(base+`Find ${n}.`,c,ds,u,st)};
const g7=()=>{let VCC,RB,RC,RE,b,IB,IC,IE,VC,VE,VB;do{VCC=pick([12,15,18,20]);RB=pick([330,430,470]);RC=pick([1.5,2,2.2,3]);RE=pick([.68,1,1.2,1.5]);b=pick([60,80,100,120]);IB=(VCC-.7)/(RB+(b+1)*RE);IC=b*IB;IE=(b+1)*IB;VC=VCC-IC*RC;VE=IE*RE;VB=VE+.7}while(VC-VE<1);
cur=['emi',{VCC,RB,RC,RE,b}];const base=`Emitter-stabilized BJT shown: VCC = ${VCC} V, RB = ${RB} kΩ, RC = ${RC} kΩ, RE = ${RE} kΩ, β = ${b}, VBE = 0.7 V. `;
const st=[["Write KVL on the base-emitter loop. RE appears (β+1) times larger from the base side.",`IB = (VCC − VBE) / (RB + (β+1)RE) = (${VCC} − 0.7) / (${RB}k + ${b+1} × ${RE}k) = ${f(IB*1000)} µA`],["Find the collector and emitter currents.",`IC = β × IB = ${f(IC)} mA,  IE = (β+1) × IB = ${f(IE)} mA`],["The emitter voltage is IE times RE.",`VE = ${f(IE)} × ${RE} = ${f(VE)} V`],["The base is one junction drop above the emitter.",`VB = VE + 0.7 = ${f(VB)} V`],["The collector voltage is the supply minus the drop across RC.",`VC = VCC − IC × RC = ${VCC} − ${f(IC)} × ${RC} = ${f(VC)} V`]];
const [n,c,ds]=pick([["VB",VB,[VE,VC,VB*1.4,.7]],["VE",VE,[VB,IC*RE,VE*2,VC]],["VC",VC,[VCC-IE*RC,VCC-IC*(RC+RE),VCC-.7,VB]]]);return mc(base+`Find ${n}.`,c,ds,"V",st)};
// ---- STATE & FLOW
let S={};
function home(){clearInterval(S.tm);S={};$('app').innerHTML=`<div class="card c"><h1>Elecs 2 Mock exam test</h1><p class="mu">Diodes and BJTs. Choose a part to begin.</p><button class="big" onclick="setPart(1)">Part 1 (Conceptual)</button><button class="big" onclick="setPart(2)">Part 2 (Solving)</button></div>`}
function setPart(p){S.part=p;const cap=p==1?B.length:50;$('app').innerHTML=`<div class="card c"><h2>${p==1?'Part 1 (Conceptual)':'Part 2 (Solving)'}</h2><p>Number of items</p><div class="n" id="nv">10</div><input type="range" min="1" max="50" value="10" oninput="nv.textContent=this.value"><p class="mu">Maximum 50.${p==1?` Currently ${B.length} conceptual questions are loaded, so larger picks are capped at ${B.length}.`:''}</p><button class="g" onclick="home()">Back</button> <button onclick="S.n=Math.min(+nv.textContent,${cap});pickTime()">Next</button></div>`}
function pickTime(){$('app').innerHTML=`<div class="card c"><h2>Time duration</h2><div class="n" id="tv">30 min</div><input type="range" min="15" max="72" value="30" oninput="tv.textContent=this.value+' min'"><p class="mu">15 minutes to 1.2 hours (72 min).</p><button class="g" onclick="setPart(S.part)">Back</button> <button onclick="S.mins=+tv.textContent.split(' ')[0];ready()">Next</button></div>`}
function ready(){$('app').innerHTML=`<div class="card c"><h2>Are you ready?</h2><p>${S.part==1?'Part 1':'Part 2'}: ${S.n} items in ${S.mins} minutes. The timer starts when you press Start.</p><button class="g" onclick="pickTime()">Not yet</button> <button onclick="start()">Yes, start</button></div>`}
function build(){const q=[];if(S.part==1){const b=sh(B);for(let i=0;i<S.n;i++){const[t,o,a,e]=b[i];const ix=sh([0,1,2,3]);q.push({t:'mc',q:t,o:ix.map(k=>o[k]),a:ix.indexOf(a),e,ans:"abcd"[ix.indexOf(a)]+". "+o[a]})}}else{const G=[g1,g2,g3,g4,g5,g6,g6,g7];for(let i=0;i<S.n;i++)q.push(pick(G)())}return q}
function start(){S.qs=build();S.left=S.mins*60;S.done=false;
$('app').innerHTML=`<div class="bar"><span>Score <b id="sc">--%</b></span><span id="pr" class="mu"></span><span>⏱ <b id="tm"></b></span><button id="sb" onclick="submit(false)">Submit</button></div><div id="ex" oninput="upd()">${S.qs.map(itemHTML).join('')}</div>`;
S.qs.forEach((q,i)=>q.t=='load'&&draw(i));tick();upd();S.tm=setInterval(()=>{S.left--;tick();if(S.left<=0)submit(true)},1000)}
function tick(){const s=Math.max(S.left,0),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;$('tm').textContent=(h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(c).padStart(2,"0");$('tm').style.color=s<60?'var(--bad)':''}
function itemHTML(q,i){let h=`<div class="card" id="q${i}"><b>${i+1}.</b> ${q.q}<div class="ci">${q.img||''}</div>`;
if(q.t=='mc')h+=q.o.map((o,k)=>`<label class="opt" id="o${i}_${k}"><input type="radio" name="r${i}" value="${k}"> <b>${"abcd"[k]}.</b> ${o}</label>`).join('');
else h+=`<canvas id="cv${i}" width="520" height="320"></canvas><div class="pt">Point 1: VD <input id="p${i}_0" type="number" step="any"> ID <input id="p${i}_1" type="number" step="any"></div><div class="pt">Point 2: VD <input id="p${i}_2" type="number" step="any"> ID <input id="p${i}_3" type="number" step="any"></div>`;
return h+`<div class="fb" id="fb${i}"></div></div>`}
const val=(i,k)=>{const e=$(`p${i}_${k}`);return e&&e.value!==''?+e.value:null};
function pts(i){const a=[0,1,2,3].map(k=>val(i,k));return[[a[0],a[1]],[a[2],a[3]]]}
function answered(i){const q=S.qs[i];return q.t=='mc'?!!document.querySelector(`input[name=r${i}]:checked`):[0,1,2,3].every(k=>val(i,k)!==null)}
function upd(e){S.qs.forEach((q,i)=>q.t=='load'&&draw(i));$('pr').textContent="Answered "+S.qs.filter((q,i)=>answered(i)).length+"/"+S.qs.length}
function draw(i,rev){const q=S.qs[i],c=$('cv'+i),x=c.getContext('2d'),W=c.width,H=c.height,m=36,cs=getComputedStyle(document.documentElement),fg=cs.getPropertyValue('--fg'),bd=cs.getPropertyValue('--bd');
const X=v=>m+v/q.E*(W-m-12),Y=y=>H-m-y/q.ym*(H-m-12);x.clearRect(0,0,W,H);x.font='11px sans-serif';x.lineWidth=1;
for(let k=0;k<=5;k++){const v=q.E*k/5,y=q.ym*k/5;x.strokeStyle=bd;x.beginPath();x.moveTo(X(v),Y(0));x.lineTo(X(v),Y(q.ym));x.moveTo(X(0),Y(y));x.lineTo(X(q.E),Y(y));x.stroke();x.fillStyle=fg;x.fillText(f(v,1),X(v)-8,H-m+14);x.fillText(f(y,1),4,Y(y)+4)}
x.fillStyle=fg;x.fillText('VD (V)',W/2-16,H-6);x.fillText('ID (mA)',4,11);
x.strokeStyle='#e08a00';x.lineWidth=2.5;x.beginPath();let on=0;for(let k=0;k<=1500;k++){const v=q.E*k/1500,y=ID(v);if(y>q.ym)break;on?x.lineTo(X(v),Y(y)):x.moveTo(X(v),Y(y));on=1}x.stroke();x.fillStyle='#e08a00';x.fillText('Diode curve',X(q.E*.35),Y(q.ym*.15));
if(rev){x.strokeStyle='#16a34a';x.lineWidth=2;x.setLineDash([6,4]);x.beginPath();x.moveTo(X(0),Y(q.Im));x.lineTo(X(q.E),Y(0));x.stroke();x.setLineDash([]);x.fillStyle='#dc2626';x.beginPath();x.arc(X(q.VQ),Y(q.IQ),5,0,7);x.fill();x.fillText('Q',X(q.VQ)+8,Y(q.IQ)-6)}
const p=pts(i).map(a=>a[0]!==null&&a[1]!==null?a:null);x.strokeStyle=x.fillStyle='#2563eb';x.lineWidth=2.5;
if(p[0]&&p[1]){x.beginPath();x.moveTo(X(p[0][0]),Y(p[0][1]));x.lineTo(X(p[1][0]),Y(p[1][1]));x.stroke()}
p.forEach((a,k)=>{if(a){x.beginPath();x.arc(X(a[0]),Y(a[1]),5,0,7);x.fill();x.fillText('P'+(k+1),X(a[0])+7,Y(a[1])-6)}})}
function checkLoad(i){const q=S.qs[i],p=pts(i);if(p.flat().some(v=>v===null))return false;const tol=.03*q.E+.05;return p.every(a=>Math.abs(a[0]+a[1]*q.R-q.E)<=tol)&&Math.hypot(p[0][0]-p[1][0],(p[0][1]-p[1][1])*q.R)>.2}
function submit(force){if(S.done)return;const un=S.qs.filter((q,i)=>!answered(i)).length;if(!force&&un&&!confirm(un+" item(s) unanswered. Submit anyway?"))return;
clearInterval(S.tm);S.done=true;let c=0;
S.qs.forEach((q,i)=>{let ok;if(q.t=='mc'){const r=document.querySelector(`input[name=r${i}]:checked`);ok=!!r&&+r.value==q.a;$(`o${i}_${q.a}`).classList.add('ok');if(r&&!ok)$(`o${i}_${r.value}`).classList.add('bad')}else{ok=checkLoad(i);draw(i,1)}
if(ok)c++;const fb=$('fb'+i);fb.innerHTML=`<span class="${ok?'good':'no'}">${ok?'✔ Correct':'✘ Incorrect'}</span> Answer: ${q.ans}`+(S.part==1?`<br><b>Explanation:</b> ${q.e}`:`<br><button class="g" onclick="openBot(${i})">Explanation</button>`)});
document.querySelectorAll('#ex input').forEach(e=>e.disabled=true);const pc=Math.round(c/S.qs.length*100);$('sc').textContent=pc+"%";$('sc').style.color=pc>=60?'var(--ok)':'var(--bad)';
const b=$('sb');b.textContent='New exam';b.onclick=home;$('ex').insertAdjacentHTML('afterbegin',`<div class="card c"><h2>Score: ${c} / ${S.qs.length} (${pc}%)</h2><p class="mu">${force?"Time is up. ":""}Scroll down to review every item.</p></div>`);scrollTo(0,0)}
function openBot(i){const q=S.qs[i],t=S.bt=Date.now();$('bot').style.display='flex';$('chat').innerHTML='';
$('sol').innerHTML='<div class="ci">'+(q.img||'')+'</div><b>Solution</b>'+q.steps.map((s,k)=>`<div class="st"><span>Step ${k+1}</span><p>${s[1]}</p></div>`).join('')+`<div class="st"><span>Answer</span><p>${q.ans}</p></div>`;
const m=[`Hi! Let's go through item ${i+1} together.`,...q.steps.map((s,k)=>`Step ${k+1}: ${s[0]}`),`So the answer is ${q.ans}.`];
m.forEach((s,k)=>setTimeout(()=>{if(S.bt!=t)return;const d=document.createElement('div');d.className='bub';d.textContent=s;$('chat').appendChild(d)},k*900))}
function closeBot(){S.bt=0;$('bot').style.display='none'}
home();
</script></body></html>
